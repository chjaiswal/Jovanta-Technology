services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-services_site}
      POSTGRES_USER: ${POSTGRES_USER:-services_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-services_user} -d ${POSTGRES_DB:-services_site}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/services_site}
      DB_USERNAME: ${DB_USERNAME:-services_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFICATION_TO: ${NOTIFICATION_TO:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [backend]
    networks: [private]

volumes:
  postgres_data:

networks:
  private:
